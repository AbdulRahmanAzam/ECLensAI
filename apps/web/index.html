<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ECLens AI — explainable Expected Credit Loss platform for banks, microfinance institutions and NBFCs. IFRS 9 ECL with full auditability."
    />
    <meta name="theme-color" content="#0b1a2b" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..600&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231a3e60'/%3E%3Cstop offset='1' stop-color='%230b1a2b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 21.5 15 10l6 11.5' fill='none' stroke='%232dd4bf' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M11.6 18h6.8' fill='none' stroke='%232dd4bf' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>ECLens AI — Explainable Expected Credit Loss</title>

    <script>
      // Resolve the theme before first paint. Without this the app renders one
      // light frame before React mounts, which reads as a flash on dark.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('eclens.settings') || '{}');
          var choice = stored.theme || 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
